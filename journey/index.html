<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journey Gravity — an absorbing Markov chain over real site journeys</title>
<!--
  Data: anonymized aggregate of ICP lead journeys across retellai.com properties.
  No PII — page paths, transition counts and dwell sums only. Regenerate with:
      python build_data.py
  (source CSVs are private and NOT in this repo — see NOTES.md)
-->
<style>
  :root {
    --panel: rgba(18,20,27,.82);
    --line: rgba(255,255,255,.11);
    --text: #e6e8ef;
    --dim: #8e93a6;
    --muted: #898781;
    --accent: #86b6ef;
    /* validated dark-mode palette (surface #0b0d12) */
    --www: #3987e5;       /* categorical slot 1 */
    --dashboard: #d95926; /* categorical slot 2 */
    --docs: #199e70;      /* categorical slot 3 */
    --booked: #0ca30c;    /* status: good */
    --lost: #d03b3b;      /* status: critical */
    --div-hi: #3987e5;    /* diverging pole: above base */
    --div-lo: #e66767;    /* diverging pole: below base */
    --div-mid: #8a8a85;   /* diverging midpoint: neutral gray */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0b0d12; }
  body {
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text); overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  #ui {
    position: fixed; top: 14px; right: 14px; width: 292px;
    max-height: calc(100vh - 28px); overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px 14px;
  }
  #ui.collapsed .body { display: none; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
       margin: 0; color: var(--dim); }
  #toggle { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px;
            cursor: pointer; font-size: 11px; padding: 2px 7px; }
  #toggle:hover { color: var(--text); }

  .group { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .group:first-of-type { border-top: 0; margin-top: 10px; padding-top: 0; }
  .glabel { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim);
            margin-bottom: 8px; }

  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px;
         margin-bottom: 9px; }
  .row label { font-size: 12px; }
  .row label[title] { cursor: help; border-bottom: 1px dotted rgba(255,255,255,.28); }
  .row .val { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--accent); }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; height: 3px; -webkit-appearance: none;
                           appearance: none; background: rgba(255,255,255,.14); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%;
    background: var(--accent); cursor: pointer; }

  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; cursor: pointer;
           font-size: 12px; }
  .check input { accent-color: var(--accent); }

  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button.act { flex: 1 1 auto; background: rgba(255,255,255,.06); border: 1px solid var(--line);
               color: var(--text); border-radius: 7px; padding: 6px 8px; cursor: pointer;
               font-size: 12px; }
  button.act:hover { background: rgba(255,255,255,.13); }
  button.act.on { background: var(--accent); border-color: var(--accent); color: #0b1626;
                  font-weight: 600; }

  .note { font-size: 11px; line-height: 1.4; color: var(--dim); margin-top: 7px; }

  /* legend */
  #legend .item { display: flex; align-items: center; gap: 7px; font-size: 11px; margin-bottom: 5px; }
  #legend .sw { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;
                border: 1px solid rgba(255,255,255,.18); }
  #legend .bar { height: 8px; border-radius: 4px; margin: 4px 0 3px; }
  #legend .ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim);
                  font-variant-numeric: tabular-nums; }

  /* ranked lists */
  .rank { margin-top: 4px; }
  .rank .r { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 4px;
             border-radius: 5px; cursor: pointer; font-size: 11px; align-items: baseline; }
  .rank .r:hover { background: rgba(255,255,255,.07); }
  .rank .r .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .r .v { font-variant-numeric: tabular-nums; color: var(--dim); }
  .rank .r.sel { background: rgba(134,182,239,.14); }

  /* details panel */
  #detail {
    position: fixed; top: 14px; left: 14px; width: 316px; display: none;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px;
    max-height: calc(100vh - 28px); overflow-y: auto;
  }
  #detail h2 { font-size: 13px; margin: 0 26px 2px 0; word-break: break-all; font-weight: 600; }
  #detail .prop { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #detail .close { position: absolute; top: 10px; right: 12px; background: none; border: 0;
                   color: var(--dim); font-size: 14px; cursor: pointer; }
  #detail .close:hover { color: var(--text); }
  #detail table { width: 100%; border-collapse: collapse; margin-top: 9px; }
  #detail td { padding: 2.5px 0; font-size: 11.5px; }
  #detail td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
  #detail .sub { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim);
                 margin: 12px 0 5px; padding-top: 10px; border-top: 1px solid var(--line); }
  #detail .edge { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 11px;
                  padding: 2.5px 0; align-items: baseline; }
  #detail .edge .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  #detail .edge .p:hover { color: var(--accent); }
  #detail .edge .n { font-variant-numeric: tabular-nums; color: var(--dim); }
  #detail .ebar { height: 3px; border-radius: 2px; background: rgba(134,182,239,.55);
                  grid-column: 1 / -1; margin: 0 0 2px; }

  /* tooltip */
  #tip { position: fixed; display: none; pointer-events: none; z-index: 10;
         background: rgba(10,12,17,.94); border: 1px solid var(--line); border-radius: 8px;
         padding: 7px 10px; font-size: 11px; max-width: 300px; }
  #tip .t { font-weight: 600; word-break: break-all; margin-bottom: 3px; }
  #tip .d { color: var(--dim); font-variant-numeric: tabular-nums; }

  /* data table overlay */
  #tableWrap { position: fixed; inset: 40px; display: none; z-index: 20;
               background: rgba(10,12,17,.97); border: 1px solid var(--line); border-radius: 12px;
               padding: 16px; overflow: auto; }
  #tableWrap h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                  color: var(--dim); margin: 0 0 10px; }
  #tableWrap .close { position: absolute; top: 12px; right: 16px; background: none; border: 0;
                      color: var(--dim); font-size: 15px; cursor: pointer; }
  #tableWrap table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  #tableWrap th { text-align: right; font-weight: 600; color: var(--dim); padding: 4px 10px;
                  border-bottom: 1px solid var(--line); position: sticky; top: -17px;
                  background: rgba(10,12,17,.97); cursor: pointer; white-space: nowrap; }
  #tableWrap th:first-child, #tableWrap td:first-child { text-align: left; }
  #tableWrap td { padding: 3px 10px; font-variant-numeric: tabular-nums; text-align: right;
                  border-bottom: 1px solid rgba(255,255,255,.05); }
  #tableWrap td:first-child { word-break: break-all; }

  #stats { position: fixed; left: 14px; bottom: 12px; font-size: 11px;
           font-variant-numeric: tabular-nums; pointer-events: none;
           color: rgba(255,255,255,.40); }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="stats"></div>
<div id="tip"></div>

<aside id="ui">
  <header>
    <h1 id="h1">Journey Gravity</h1>
    <span style="display:flex;gap:6px">
      <a href="index-lakehouse.html" id="siblink" style="font-size:11px;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 7px" title="The same model over every warehouse session">warehouse</a>
      <a href="sankey.html" style="font-size:11px;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 7px" title="The same journeys as a step-by-step funnel">funnel</a>
      <button id="toggle">hide</button>
    </span>
  </header>

  <div class="body">
    <div class="group">
      <div class="glabel">Colour by</div>
      <div class="btns" id="colorby"></div>
      <div class="note" id="cbnote"></div>
      <div id="legend" style="margin-top:9px"></div>
    </div>

    <div class="group">
      <div class="glabel">Model</div>
      <div class="btns" id="scopeBtns" style="margin-bottom:7px"></div>
      <div class="note" id="scopenote" style="margin-bottom:10px"></div>
      <div class="btns" id="modeBtns" style="margin-bottom:9px"></div>
      <div class="note" id="modenote" style="margin-bottom:10px"></div>
      <div class="row">
        <label title="Pseudo-visits added to every page's outgoing counts, split by the base rate. 0 trusts tiny samples completely; higher values shrink low-traffic pages toward the base rate. Watch the ranking stabilise as you raise it.">Prior strength κ</label><span class="val" id="v_k"></span>
        <input type="range" id="k" min="0" max="20" step="0.5">
      </div>
      <div class="note" id="modelnote"></div>
    </div>

    <div class="group">
      <div class="glabel">Display</div>
      <div class="row">
        <label title="Hide edges with fewer transitions than this. Display only — the model always uses every edge.">Min edge count</label><span class="val" id="v_e"></span>
        <input type="range" id="e" min="1" max="12" step="1">
      </div>
      <div class="row">
        <label title="Ranked lists below ignore pages with fewer visits than this.">Min visits (lists)</label><span class="val" id="v_mv"></span>
        <input type="range" id="mv" min="1" max="30" step="1">
      </div>
      <div class="row">
        <label title="Pages with fewer visits than this fold into one dashed '(other …)' node per property, carrying their traffic with them. Display only — the model always uses every page.">Fold tail below</label><span class="val" id="v_mm"></span>
        <input type="range" id="mm" min="1" max="20" step="1">
      </div>
      <label class="check"><input type="checkbox" id="fate" checked> fate layout
        <span class="val" title="Pulls each page vertically toward its fate: high gravity floats up toward BOOKED, low sinks toward LOST. Height becomes meaning."></span></label>
      <label class="check"><input type="checkbox" id="loops"> show self-loops
        <span class="val" title="Reloads and repeat views. They never change where a walk ends — only how long it takes — so absorption probabilities ignore them by construction."></span></label>
      <label class="check"><input type="checkbox" id="labels" checked> page labels</label>
      <div class="btns" style="margin-top:6px">
        <button class="act" id="tableBtn">data table</button>
        <button class="act" id="reheat" title="Re-run the layout and release every pinned node">re-layout</button>
      </div>
      <div class="note">Drag a node to pin it where you drop it — a small white dot marks it pinned. Double-click releases one; re-layout releases all.</div>
    </div>

    <div class="group">
      <div class="glabel" id="topLabel" title="P(walk ends in the absorbing state | you are on this page), under the fitted chain. Base rate marked ·">Highest pull toward booked</div>
      <div class="rank" id="topRank"></div>
    </div>

    <div class="group">
      <div class="glabel" id="lowLabel">Lowest pull</div>
      <div class="rank" id="lowRank"></div>
      <div class="note" id="lowNote"></div>
    </div>

    <div class="group">
      <div class="glabel">Data</div>
      <div class="note" id="datanote"></div>
    </div>
  </div>
</aside>

<div id="detail">
  <button class="close" id="dclose">✕</button>
  <div class="prop" id="dprop"></div>
  <h2 id="dtitle"></h2>
  <table id="dstats"></table>
  <div id="dmeaning"></div>
  <div class="sub">Where walks from here go next</div>
  <div id="dedges"></div>
</div>

<div id="tableWrap">
  <button class="close" id="tclose">✕</button>
  <h2>All pages — click a header to sort</h2>
  <table id="bigTable"></table>
</div>

// kappa*base pseudo-counts -> BOOKED and kappa*(1-base) -> LOST to every page.
// Warehouse-sourced twin: same model, but the absorbing state is "reached the

//    Answers "is this page's visitor the booking kind?" — but paints BOOKED

    const absorbNonBooked = () => {

    };

const GATES = new Set(["/enterprise-plan"]);

  .sort().map(id => ({ id, pseudo: "start", origin: id }));

    else b = mapIx(pageIx.get(e.to));

    let fx = -a.x * cgrav, fy = -a.y * cgrav * (S.fateLayout ? 0.15 : 1.7);
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy + 40;
      const f = rep / d2;
      const d = Math.sqrt(d2);
      fx += f * dx / d; fy += f * dy / d;
    }
    a.vx = (a.vx + fx * heat) * damp; a.vy = (a.vy + fy * heat) * damp;
  }
  for (const e of allEdges) {
    if (e.self) continue;
    const a = nodes[e.a], b = nodes[e.b];
    const wgt = spring * (0.4 + Math.log2(1 + e.n) * 0.35);
    const ideal = 130 + (a.r + b.r) * 2.5;
    let dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = wgt * (d - ideal) / d;
    if (!a.pin) { a.vx += f * dx * heat; a.vy += f * dy * heat; }
    if (!b.pin) { b.vx -= f * dx * heat; b.vy -= f * dy * heat; }
  }
  // fate layout: height encodes gravity RANK (evenly spaced — a linear scale
  // stacked the skewed event-mode distribution into one crowded band)
  if (S.fateLayout) {
    for (const n of nodes) {
      if (n.pseudo || n.folded || (n.other && !n.count)) continue;
      const ty = LOST.y + (BOOKED.y - LOST.y) * n.fateR;
      n.vy += (ty - n.y) * 0.06;
    }
  }
  // the doorway corridor is the gate's alone: no free page drifts past it
  let gxMax = Infinity;
  for (const n of nodes) if (n.gate) gxMax = Math.min(gxMax, n.x - 70);
  for (const n of nodes) if (!n.pin) {
    n.x += n.vx; n.y += n.vy;
    if (!n.pseudo && n.x > gxMax) n.x = gxMax;
  }
  // collision: no two visible nodes overlap — labels need the breathing room
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      if (a.folded || (a.other && !a.count)) continue;
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        if (b.folded || (b.other && !b.count)) continue;
        // big nodes carry labels, so they claim more room than their radius
        const minD = a.r + b.r + 10 + (a.r > 8 ? 8 : 0) + (b.r > 8 ? 8 : 0);
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if (d >= minD) continue;
        if (d < 1e-3) { dx = 1; dy = 0; d = 1; }
        const push = (minD - d) / d * 0.5;
        if (!a.pin && !b.pin) {
          a.x -= dx * push; a.y -= dy * push;
          b.x += dx * push; b.y += dy * push;
        } else if (!a.pin) { a.x -= dx * push * 2; a.y -= dy * push * 2; }
        else if (!b.pin) { b.x += dx * push * 2; b.y += dy * push * 2; }
      }
    }
  }
  heat = Math.max(0.05, heat * 0.9985);
}

/* ---------- color ---------- */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL = {
  www: css("--www"), dashboard: css("--dashboard"), docs: css("--docs"),
  booked: css("--booked"), lost: css("--lost"),
  hi: css("--div-hi"), lo: css("--div-lo"), mid: css("--div-mid"),
};
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h1, h2, t) {
  const a = hex2rgb(h1), b = hex2rgb(h2);
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`;
}
// sequential blue ramp for dwell (dark-mode steps, low -> high)
const SEQ = ["#184f95", "#2a78d6", "#5598e7", "#86b6ef", "#cde2fb"];
function seqColor(t) {
  const x = Math.max(0, Math.min(1, t)) * (SEQ.length - 1);
  const i = Math.min(SEQ.length - 2, Math.floor(x));
  return mix(SEQ[i], SEQ[i + 1], x - i);
}
let gLo = 0, gHi = 1; // gravity color range (set after solve)
// sqrt easing so near-base differences still register visibly
function gravColor(g) {
  if (g >= BASE) { const t = Math.sqrt((g - BASE) / Math.max(1e-9, gHi - BASE)); return mix(COL.mid, COL.hi, Math.min(1, t)); }
  const t = Math.sqrt((BASE - g) / Math.max(1e-9, BASE - gLo)); return mix(COL.mid, COL.lo, Math.min(1, t));
}
const maxDwellMean = () => Math.max(...pages.map(p => p.visits ? p.dwell / p.visits : 0));

function nodeColor(n) {
  if (n.pseudo === "booked") return COL.booked;
  if (n.pseudo === "app") return COL.dashboard; // handed to the product, not lost
  if (n.pseudo === "lost") return S.mode === "event" ? "#8e93a6" : COL.lost;
  if (n.pseudo === "start") return "#b8bdcc";

  if (S.colorby === "dwell") return seqColor((n.visits ? n.dwell / n.visits : 0) / maxDwellMean());

function bindRange(id, valId, key, fmt, after) {
  const el = $(id);
  el.value = S[key];
  const show = () => $(valId).textContent = fmt(S[key]);
  el.oninput = () => { S[key] = +el.value; show(); after && after(); };
  show();
}

function refit() {
  buildCounts(S.mode);
  LOST.id = S.mode === "event" ? "EXIT" : "LOST";
  solve(S.kappa);
  buildGraphEdges(S.mode); // after solve: the "(other)" aggregates average model.g
  const gs = pages.map((p, i) => model.g[i]);
  gLo = Math.min(...gs); gHi = Math.max(...gs);
  // fate-axis targets by RANK: evenly spaced top-to-bottom, ties broken by g
  const ranked = [];
  for (let i = 0; i < N; i++) if (!nodes[i].folded) ranked.push([nodes[i], model.g[i]]);
  for (const o of OTHERS) if (o.count) ranked.push([o, o.gMean]);
  ranked.sort((a, b) => a[1] - b[1]);
  ranked.forEach(([n], k) => { n.fateR = ranked.length > 1 ? 0.03 + 0.94 * k / (ranked.length - 1) : 0.5; });
  $("modenote").textContent = modeNotes[S.mode];
  const inc = DATA.inclusion;
  // the warehouse dataset is marketing-site-only by construction, so the
  // app/www scope split (and its note) has nothing to say there
  $("scopenote").innerHTML = !inc
    ? `Marketing-site sessions only — this source carries no product-side journeys, so there is no scope to switch.`
    : S.scope === "www"
    ? `The funnel's real denominator: the <b>${inc.sessionsWww}</b> sessions that touch the marketing site at least once. ` +
      `Excluded: ${Object.entries(inc.excluded).map(([k, v]) => `${v} ${k}`).join(", ")}.`
    : `All <b>${inc.sessionsAll}</b> sessions, including ${inc.excluded["pure app"] || 0} that never leave the product — ` +
      `they can't reach the form, so they drag the rate down without being failures.`;
  $("lowLabel").textContent = REACH ? "Lowest pull — the site's dead ends"
    : S.mode === "event" ? "Lowest pull — the product lane" : "Lowest pull — attention sinks";
  $("lowNote").textContent = REACH
    ? "Pages a walk rarely leaves for the form. With 235k sessions the ranking is well-powered — the κ slider matters far less here than on the 53-lead chain."
    : S.mode === "event"
    ? "Low here ≠ bad page: product-usage sessions rarely end at the form. Compare with Visitor fate — these same pages predict who books."
    : "High dwell + low gravity = the site's swamps: time goes in, bookings don't come out.";
  $("modelnote").innerHTML =
    `Base rate (session-weighted): <b>${(BASE * 100).toFixed(1)}%</b> · ` +
    `model start-of-session: <b>${(model.startG * 100).toFixed(1)}%</b><br>` +
    `Gravity range ${(gLo * 100).toFixed(0)}–${(gHi * 100).toFixed(0)}%`;
  renderLegend(); renderRanks(); renderDetail(); renderTable();
}

bindRange("k", "v_k", "kappa", v => v.toFixed(1), refit);
bindRange("e", "v_e", "minEdge", v => "≥ " + v);
bindRange("mv", "v_mv", "minVisits", v => "≥ " + v, () => renderRanks());
bindRange("mm", "v_mm", "mapMin", v => "≥ " + v, () => { refit(); heat = Math.max(heat, 0.5); });
$("fate").checked = S.fateLayout;
$("fate").onchange = e => { S.fateLayout = e.target.checked; heat = Math.max(heat, 0.6); };
$("loops").checked = S.loops; $("loops").onchange = e => S.loops = e.target.checked;
$("labels").checked = S.labels; $("labels").onchange = e => S.labels = e.target.checked;

/* ---------- ranked lists ---------- */
let selected = -1;
function rankRow(container, i) {

/* ---------- detail panel ---------- */
function fmtTime(s) { return s >= 90 ? (s / 60).toFixed(1) + " min" : s.toFixed(0) + " s"; }
function select(i) { selected = i; renderDetail(); renderRanks(); }
$("dclose").onclick = () => { selected = -1; renderDetail(); renderRanks(); };

function renderDetail() {
  const D = $("detail");
  if (selected < 0 || selected >= N) { D.style.display = "none"; return; }
  D.style.display = "block";
  const p = pages[selected], i = selected;
  $("dprop").textContent = p.prop + (GATES.has(p.id) ? " · GATE — the demo-request form" : "");
  $("dtitle").textContent = p.id;
  const emp = p.visitsBooked + p.visitsLost ? p.visitsBooked / (p.visitsBooked + p.visitsLost) : 0;
  const rows = [
    ["Visits / unique visitors", `${pageVisits(p)} / ${p.visitors}`],
    ["Session entries here", p.entries],
    ["Mean dwell per visit", fmtTime(p.visits ? p.dwell / p.visits : 0)],
    ["Gravity — P(ends booked)", (model.g[i] * 100).toFixed(1) + "%"],
    ["vs base rate", (model.g[i] >= BASE ? "+" : "") + ((model.g[i] - BASE) * 100).toFixed(1) + " pp"],
    ["Empirical (visits by fate)", (emp * 100).toFixed(0) + "% booked"],
    ["Expected remaining pages", model.steps[i].toFixed(1)],
    ["Expected remaining time", fmtTime(model.time[i])],
  ];
  $("dstats").innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
  let extra = MEANING[p.id] ? `<div class="note" style="margin-top:8px">${MEANING[p.id]}</div>` : "";
  if (GATES.has(p.id)) extra += `<div class="note">⚠ Some sessions that end here without booking reflect known form/scheduler failure modes — technical losses, not necessarily lost intent.</div>`;
  $("dmeaning").innerHTML = extra;
  // outgoing distribution
  let T = outB[i] + outL[i];
  for (const n of outTo[i].values()) T += n;
  const outs = [...outTo[i]].map(([j, n]) => ({ label: pages[j].id, n, j }));
  const exitLbl = S.mode === "event" ? "EXIT" : "LOST";
  if (outB[i]) outs.push({ label: S.mode === "event" ? "→ BOOKED (books here)" : "→ BOOKED (session ends)", n: outB[i], j: -1 });
  if (outL[i]) outs.push({ label: `→ ${exitLbl} (session ends)`, n: outL[i], j: -1 });
  outs.sort((a, b) => b.n - a.n);
  $("dedges").innerHTML = "";
  for (const o of outs.slice(0, 12)) {
    const d = document.createElement("div"); d.className = "edge";
    d.innerHTML = `<span class="p">${o.label}</span><span class="n">${(o.n / T * 100).toFixed(0)}% · ${o.n}</span>` +
      `<span class="ebar" style="width:${(o.n / T * 100).toFixed(1)}%"></span>`;
    if (o.j >= 0) d.querySelector(".p").onclick = () => select(o.j);
    $("dedges").appendChild(d);
  }
}

/* ---------- full data table ---------- */
let sortKey = "g", sortDir = -1;
const tcols = [
  ["id", "page", p => p.id],
  ["prop", "prop", p => p.prop],
  ["visits", "visits", p => pageVisits(p)],
  ["visitors", "visitors", p => p.visitors],
  ["dwell", "s/visit", p => p.visits ? p.dwell / p.visits : 0],
  ["g", "gravity", (p, i) => model.g[i]],
  ["steps", "exp. pages", (p, i) => model.steps[i]],
  ["time", "exp. time s", (p, i) => model.time[i]],
];
function renderTable() {
  const T = $("bigTable");
  const ix = pages.map((p, i) => i);
  const col = tcols.find(c => c[0] === sortKey);
  ix.sort((a, b) => {
    const va = col[2](pages[a], a), vb = col[2](pages[b], b);
    return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
  });
  T.innerHTML = "<tr>" + tcols.map(c =>
    `<th data-k="${c[0]}">${c[1]}${c[0] === sortKey ? (sortDir < 0 ? " ↓" : " ↑") : ""}</th>`).join("") + "</tr>" +
    ix.map(i => { const p = pages[i]; return "<tr>" + tcols.map(c => {
      let v = c[2](p, i);
      if (c[0] === "g") v = (v * 100).toFixed(1) + "%";
      else if (typeof v === "number") v = v.toFixed(v >= 100 ? 0 : 1);
      return `<td>${v}</td>`; }).join("") + "</tr>"; }).join("");
  T.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (k === sortKey) sortDir *= -1; else { sortKey = k; sortDir = -1; }
    renderTable();
  });
}
$("tableBtn").onclick = () => { $("tableWrap").style.display = "block"; renderTable(); };
$("tclose").onclick = () => $("tableWrap").style.display = "none";

/* ---------- canvas render ---------- */
const cv = $("c"), ctx = cv.getContext("2d");
let dpr = 1, cam = { x: 0, y: 0, z: 1 };
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  pinAnchors();
}
addEventListener("resize", resize); resize();

const toScreen = (x, y) => [(x - cam.x) * cam.z + (W - PANEL) / 2, (y - cam.y) * cam.z + H / 2];
const toWorld = (sx, sy) => [(sx - (W - PANEL) / 2) / cam.z + cam.x, (sy - H / 2) / cam.z + cam.y];

let t0 = performance.now();
function draw(now) {
  const t = (now - t0) / 1000;
  if (cv.width === 0 && innerWidth > 0) resize(); // pane was hidden at boot
  for (let s = 0; s < 3; s++) tick();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // focus: hovering or selecting a node dims everything outside its neighborhood
  const focusIx = (hover >= 0 && hover < N) ? hover : (selected >= 0 ? selected : -1);
  const inFocus = ix => focusIx < 0 || ix === focusIx || neighbors[focusIx].has(ix);
  const hidden = ix => nodes[ix].folded || (nodes[ix].other && !nodes[ix].count);

  // edges
  for (const e of allEdges) {
    if (e.n < S.minEdge) continue;
    if (hidden(e.a) || hidden(e.b)) continue;
    const a = nodes[e.a], b = nodes[e.b];
    const dim = !(inFocus(e.a) && inFocus(e.b)) ||
                (focusIx >= 0 && e.a !== focusIx && e.b !== focusIx);
    if (e.self) {
      if (!S.loops || dim) continue;
      const [sx, sy] = toScreen(a.x, a.y);
      ctx.beginPath();
      ctx.arc(sx + (a.r + 5) * cam.z, sy - (a.r + 5) * cam.z, (4 + 3 * e.n / maxEdge) * cam.z, 0, 7);
      ctx.strokeStyle = "rgba(142,147,166,.30)"; ctx.lineWidth = 1;
      ctx.stroke();
      continue;
    }
    const [x1, y1] = toScreen(a.x, a.y), [x2, y2] = toScreen(b.x, b.y);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1;
    const off = Math.min(40, d * 0.14);
    const cxp = mx - dy / d * off, cyp = my + dx / d * off;
    const wgt = Math.sqrt(e.n / maxEdge); // sqrt: mid-traffic edges stay visible
    let col = "142,147,166";
    if (nodes[e.b].pseudo === "booked" && (S.mode === "fate" || nodes[e.a].gate)) col = "12,163,12";
    else if (nodes[e.b].pseudo === "lost" && S.mode === "fate") col = "208,59,59";
    let alpha = 0.07 + 0.38 * wgt;
    if (dim) alpha *= 0.12;
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cxp, cyp, x2, y2);
    ctx.strokeStyle = `rgba(${col},${alpha})`;
    ctx.lineWidth = (0.6 + 3.2 * wgt) * cam.z;
    ctx.stroke();
    if (dim) continue; // no particles on dimmed edges
    const k = Math.min(5, 1 + Math.floor(e.n / 12));
    for (let p = 0; p < k; p++) {
      const u = ((t * (0.10 + 0.16 * wgt) + p / k + e.a * 0.137) % 1);
      const ix = (1 - u) * (1 - u) * x1 + 2 * (1 - u) * u * cxp + u * u * x2;
      const iy = (1 - u) * (1 - u) * y1 + 2 * (1 - u) * u * cyp + u * u * y2;
      ctx.beginPath();
      ctx.arc(ix, iy, Math.max(0.8, 1.3 * cam.z), 0, 7);
      ctx.fillStyle = `rgba(${col},${0.35 + 0.4 * wgt})`;
      ctx.fill();
    }
  }

  // nodes
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  const labelSet = new Set();
  if (S.labels) {
    [...pages.keys()].sort((a, b) => pageVisits(pages[b]) - pageVisits(pages[a])).slice(0, 10)
      .forEach(i => labelSet.add(i));
  }
  if (selected >= 0) labelSet.add(selected);
  if (hover >= 0 && hover < N) labelSet.add(hover);
  for (const n of nodes) if (n.gate) labelSet.add(n.ix);

  const labelQueue = [];
  for (const n of nodes) {
    if (!n.pseudo && hidden(n.ix)) continue;
    // an absorbing state nothing reaches is noise, not information — a dataset
    // with no product-side journeys should not show an empty APP anchor
    if (n.anchor && n.absorbed === 0) continue;
    const [sx, sy] = toScreen(n.x, n.y);
    const dimmed = !n.pseudo && !inFocus(n.ix);
    const r = n.r * cam.z;
    ctx.globalAlpha = dimmed ? 0.25 : n.other ? 0.8 : 1;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7);
    ctx.fillStyle = nodeColor(n);
    ctx.fill();
    ctx.lineWidth = 1;
    if (n.other) { ctx.setLineDash([3, 2.5]); ctx.strokeStyle = "rgba(255,255,255,.45)"; }
    else ctx.strokeStyle = "rgba(255,255,255,.22)"; // 1px ring separates overlapping marks
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    if (n.pin && !n.anchor) { // user-pinned: a small pin head at the node's shoulder
      ctx.beginPath(); ctx.arc(sx + r * 0.8, sy - r * 0.8, 2.6, 0, 7);
      ctx.fillStyle = "#e6e8ef"; ctx.fill();
      ctx.strokeStyle = "rgba(11,13,18,.9)"; ctx.lineWidth = 1; ctx.stroke();
    }
    if (n.gate) { // the doorway: a dashed portal ring in BOOKED's green
      ctx.globalAlpha = dimmed ? 0.3 : 1;
      ctx.beginPath(); ctx.arc(sx, sy, r + 5 * cam.z, 0, 7);
      ctx.setLineDash([4 * cam.z, 3 * cam.z]);
      ctx.strokeStyle = "rgba(12,163,12,.75)"; ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "600 9px ui-sans-serif, system-ui, sans-serif";
      ctx.fillStyle = "rgba(12,163,12,.9)";
      ctx.textAlign = "center";
      ctx.fillText("GATE", sx, sy + r + 13 * cam.z);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;
    }
    if (n.ix === selected || n.ix === hover) {
      ctx.beginPath(); ctx.arc(sx, sy, r + 3.5, 0, 7);
      ctx.strokeStyle = "rgba(230,232,239,.85)"; ctx.lineWidth = 1.5; ctx.stroke();
    }
    if (n.pseudo) {
      ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
      ctx.strokeStyle = "rgba(11,13,18,.9)"; ctx.lineWidth = 3; ctx.lineJoin = "round";
      ctx.fillStyle = "#e6e8ef";
      ctx.textAlign = "center";
      const lbl = n.pseudo === "start" ? `${n.id} · ${n.entries || 0}` : n.id;
      ctx.strokeText(lbl, sx, sy - r - 9);
      ctx.fillText(lbl, sx, sy - r - 9);
      if (n.pseudo && n.pseudo !== "start" && n.absorbed != null) {
        ctx.font = "10px ui-sans-serif, system-ui, sans-serif";
        ctx.fillStyle = "rgba(230,232,239,.62)";
        const pct = (n.absorbed / totEnds() * 100).toFixed(0);
        ctx.strokeText(`${n.absorbed} · ${pct}%`, sx, sy + r + 13);
        ctx.fillText(`${n.absorbed} · ${pct}%`, sx, sy + r + 13);
      }
      ctx.textAlign = "left";
    } else if ((labelSet.has(n.ix) || n.other) && !dimmed) {
      labelQueue.push({ n, sx, sy, r });
    }
  }
  // labels drawn last, greedily nudged apart so they never stack
  labelQueue.sort((a, b) => a.sy - b.sy);
  const placed = [];
  ctx.font = "10.5px ui-sans-serif, system-ui, sans-serif";
  for (const L of labelQueue) {
    const raw = label(L.n);
    const lbl = raw.length > 34 ? raw.slice(0, 33) + "…" : raw;
    const wpx = ctx.measureText(lbl).width;
    let lx = L.sx + L.r + 5, ly = L.sy;
    for (let guard = 0; guard < 6; guard++) {
      const clash = placed.find(p => Math.abs(p.ly - ly) < 12 && lx < p.lx + p.w && p.lx < lx + wpx);
      if (!clash) break;
      ly = clash.ly + 12;
    }
    placed.push({ lx, ly, w: wpx });
    ctx.strokeStyle = "rgba(11,13,18,.85)"; ctx.lineWidth = 3; ctx.lineJoin = "round";
    ctx.strokeText(lbl, lx, ly);
    ctx.fillStyle = "rgba(230,232,239,.80)";
    ctx.fillText(lbl, lx, ly);
  }
  requestAnimationFrame(draw);
}

/* ---------- interaction: hover / drag-to-pin / pan / zoom ---------- */
let hover = -1, dragNode = null, dragMoved = false, dsx = 0, dsy = 0,
    panning = false, px = 0, py = 0;
function hit(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  let best = -1, bd = 1e9;
  for (const n of nodes) {
    if (n.folded || (n.other && !n.count)) continue;
    const d = Math.hypot(n.x - wx, n.y - wy);
    if (d < Math.max(n.r + 4, 8) / 1 && d < bd) { bd = d; best = n.ix; }
  }
  return best;
}
cv.addEventListener("mousemove", ev => {
  if (dragNode) {
    if (!dragMoved && Math.hypot(ev.clientX - dsx, ev.clientY - dsy) > 4) dragMoved = true;
    if (dragMoved) {
      const [wx, wy] = toWorld(ev.clientX, ev.clientY);
      dragNode.x = wx; dragNode.y = wy; dragNode.vx = dragNode.vy = 0;
      heat = Math.max(heat, 0.25);
    }
    return;
  }
  if (panning) {
    cam.x -= (ev.clientX - px) / cam.z; cam.y -= (ev.clientY - py) / cam.z;
    px = ev.clientX; py = ev.clientY;
    return;
  }
  hover = hit(ev.clientX, ev.clientY);
  const tip = $("tip");
  if (hover >= 0 && hover < N) {
    const p = pages[hover];
    tip.style.display = "block";
    tip.style.left = Math.min(W - 310, ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
    tip.innerHTML = `<div class="t">${p.id}</div>` +
      (MEANING[p.id] ? `<div class="d" style="margin-bottom:3px">${MEANING[p.id]}</div>` : "") +
      `<div class="d">${pageVisits(p)} visits · ${p.visitors} visitors · ${fmtTime(p.visits ? p.dwell / p.visits : 0)}/visit<br>` +
      `gravity ${(model.g[hover] * 100).toFixed(1)}% (base ${(BASE * 100).toFixed(1)}%) · ` +
      `${model.steps[hover].toFixed(1)} pages, ${fmtTime(model.time[hover])} to go</div>`;
  } else if (hover >= 0 && nodes[hover].other) {
    const n = nodes[hover];
    tip.style.display = "block";
    tip.style.left = Math.min(W - 310, ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
    tip.innerHTML = `<div class="t">${n.id}</div><div class="d">` +
      `${n.count} low-traffic ${n.other} pages folded together (&lt; ${S.mapMin} visits each)<br>` +
      `${n.visits} visits combined · mean gravity ${(n.gMean * 100).toFixed(1)}%</div>`;
  } else if (hover >= 0 && nodes[hover].other) {
    const n = nodes[hover];
    tip.style.display = "block";
    tip.style.left = Math.min(W - 310, ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
    tip.innerHTML = `<div class="t">${n.id}</div><div class="d">` +
      `${n.count} pages under the map threshold, folded into one<br>` +
      `${n.visits} visits total · mean gravity ${(n.gMean * 100).toFixed(1)}%<br>` +
      `Lower "min visits (map)" to unfold them.</div>`;
  } else if (hover >= 0) {
    const n = nodes[hover];
    tip.style.display = "block";
    tip.style.left = Math.min(W - 310, ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
    tip.innerHTML = `<div class="t">${n.pseudo === "start" ? n.id : n.id}</div><div class="d">` +
      (n.pseudo === "start"
          ? `${n.entries || 0} sessions start here · model P(booked) ${((n.gMean ?? BASE) * 100).toFixed(1)}%<br>` +
            `<em>Self-reported at form fill — under-attributes several real channels.</em>`
        : n.pseudo === "booked" ? (S.mode === "event"
            ? `${totB} bookings — all through the gate. "Booked" = meeting scheduled (held-rate not measured)`
            : `${totB} session-ends by visitors who scheduled a meeting`)
        : n.pseudo === "app"
          ? `${totApp} sessions end inside the product — handed to the app, not lost. ` +
            `They are counted as non-bookings by the model, but they are a different fate.`
        : (S.mode === "event"
            ? `${totL - totApp} session-ends that left without booking`
            : `${totL - totApp} session-ends by visitors who never scheduled`)) + `</div>`;
  } else tip.style.display = "none";
});
cv.addEventListener("mousedown", ev => {
  const h = hit(ev.clientX, ev.clientY);
  if (h >= 0 && !nodes[h].anchor) {
    dragNode = nodes[h]; dragMoved = false; dsx = ev.clientX; dsy = ev.clientY;
  } else if (h < 0) {
    panning = true; px = ev.clientX; py = ev.clientY; cv.classList.add("dragging");
  }
});
addEventListener("mouseup", ev => {
  if (dragNode) {
    if (dragMoved) dragNode.pin = true; // dropping a node pins it — the map is yours
    else if (dragNode.ix < N) select(dragNode.ix);
    dragNode = null;
  } else {
    const h = hit(ev.clientX, ev.clientY);
    if (h >= 0 && h < N && (!panning || Math.hypot(ev.clientX - px, ev.clientY - py) < 3))
      select(h); // covers anchored pages like the gate
  }
  panning = false; cv.classList.remove("dragging");
});
cv.addEventListener("dblclick", ev => {
  const h = hit(ev.clientX, ev.clientY);
  if (h >= 0 && nodes[h].pin && !nodes[h].anchor) {
    nodes[h].pin = false;
    heat = Math.max(heat, 0.3);
  }
});
cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const f = Math.exp(-ev.deltaY * 0.0012);
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  cam.z = Math.max(0.25, Math.min(4, cam.z * f));
  const [nx, ny] = toWorld(ev.clientX, ev.clientY);
  cam.x += wx - nx; cam.y += wy - ny;
}, { passive: false });

/* ---------- boot ---------- */
if (REACH) {
  document.title = "Journey Gravity — the warehouse chain (reach, not conversion)";
  $("h1").textContent = "Journey Gravity — warehouse";
  $("topLabel").textContent = "Highest pull toward the form";
  const sl = $("siblink");
  if (sl) { sl.href = "index.html"; sl.textContent = "ICP graph"; }
  $("datanote").innerHTML =
    `<b>${DATA.meta.sessions.toLocaleString()} marketing-site sessions</b> · ` +
    `${DATA.meta.pageviews.toLocaleString()} pageviews · ` +
    `${DATA.meta.date_range[0]} → ${DATA.meta.date_range[1]}.<br>` +
    `Every session in the analytics warehouse — not a sample. Aggregate only: paths and ` +
    `counts, reduced in-warehouse; no identifier is read or emitted. ` +
    `<b>Gravity here is P(reaches the demo-request form)</b>, not P(books) — submissions ` +
    `are not observable in this source, so the <a href="index.html" style="color:var(--accent)">ICP ` +
    `graph</a> remains the only view with real booking outcomes. Dwell is <b>derived</b> ` +
    `from gaps between consecutive pageviews (clamped at 30 min); the source populates its ` +
    `own engagement field on ~1% of pageviews. Marketing-site host only; ` +
    `<code>/careers</code> + <code>/about-us</code> and locale prefixes normalised out. ` +
    `Window starts when the export was connected and cannot be backfilled.`;
} else {
$("datanote").innerHTML =
  `${DATA.meta.visitors} ICP visitors (${DATA.meta.visitors_booked} booked) · ` +
  `${DATA.meta.sessions} sessions · ${DATA.meta.pageviews} pageviews · ` +
  `${DATA.meta.date_range[0]} → ${DATA.meta.date_range[1]}.<br>` +
  `Anonymized aggregate — page paths and counts only; no identities. ` +
  `Every session end feeds the visitor's eventual fate (booked / lost) into the chain.`;
}
refit();
pinAnchors(); // origin nodes need their volumes before they can be stacked by size
$("stats").textContent = `${N} pages · ${allEdges.length} transitions`;
// pre-settle fully and start cold: the first paint is a still, formed map
for (let i = 0; i < 1200; i++) tick();
heat = 0.06;
requestAnimationFrame(draw);
</script>
</body>
</html>
